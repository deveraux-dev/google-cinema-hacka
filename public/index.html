<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal CallSheet</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #2a2a3f;
            --text: #cdd6f4;
            --text-muted: #a6adc8;
            --red: #f38ba8;
            --green: #a6e3a1;
            --yellow: #f9e2af;
            --blue: #89b4fa;
            --border: #45475a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { margin: 0 0 10px 0; color: var(--blue); }
        .tagline { color: var(--text-muted); font-style: italic; }
        
        .severity-badge {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.5rem;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .severity-RED, .severity-STOP { background-color: rgba(243, 139, 168, 0.2); color: var(--red); border: 2px solid var(--red); }
        .severity-GREEN { background-color: rgba(166, 227, 161, 0.2); color: var(--green); border: 2px solid var(--green); }
        .severity-REVIEW { background-color: rgba(249, 226, 175, 0.2); color: var(--yellow); border: 2px solid var(--yellow); }
        
        .card {
            background-color: var(--surface);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .card h3 { margin-top: 0; color: var(--blue); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 8px; }
        
        .tag {
            display: inline-block;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 4px;
            margin-right: 8px;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .grafana-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-radius: 6px;
            background: rgba(137, 180, 250, 0.1);
            border: 1px solid var(--blue);
        }
        .grafana-status a { color: var(--blue); text-decoration: none; font-weight: bold; }
        .grafana-status a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container" id="app">
    <p>Loading UCS data...</p>
</div>

<script>
    async function loadData() {
        try {
            const response = await fetch('output.json');
            const data = await response.json();
            
            const app = document.getElementById('app');
            
            const severity = data.safety?.severity || 'UNKNOWN';
            
            let deltasHtml = '';
            if (data.department_deltas && data.department_deltas.length > 0) {
                deltasHtml = data.department_deltas.map(d => `<li><strong>${d.department}:</strong> ${d.impact || d.delta}</li>`).join('');
            } else {
                deltasHtml = '<li>No department impacts detected.</li>';
            }

            let hazardsHtml = '';
            if (data.hazard_tags && data.hazard_tags.length > 0) {
                hazardsHtml = data.hazard_tags.map(t => `<span class="tag">Row ${t.row}: ${t.label}</span>`).join('');
            } else {
                hazardsHtml = '<span class="tag">None</span>';
            }

            let clearsHtml = '';
            if (data.safety?.required_clears && data.safety.required_clears.length > 0) {
                clearsHtml = data.safety.required_clears.map(c => `<li>⚠️ ${c}</li>`).join('');
            } else {
                clearsHtml = '<li>No mandatory clears required.</li>';
            }

            let grafanaHtml = '';
            if (data.grafana?.published) {
                const link = data.grafana.dashboard_url ? `<a href="${data.grafana.dashboard_url}" target="_blank">View Dashboard</a>` : '';
                grafanaHtml = `
                    <div class="grafana-status">
                        <span>✅ Published to Grafana via MCP</span>
                        ${link}
                    </div>
                `;
            } else {
                grafanaHtml = `
                    <div class="grafana-status" style="background: rgba(243, 139, 168, 0.1); border-color: var(--red);">
                        <span>❌ Grafana Publish Skipped: ${data.grafana?.error || 'Unknown'}</span>
                    </div>
                `;
            }

            app.innerHTML = `
                <header>
                    <h1>${data.project}</h1>
                    <div class="tagline">${data.tagline}</div>
                </header>

                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2 style="margin:0;">Scene: ${data.scene.id}</h2>
                        <div style="color: var(--text-muted); font-size: 1.2rem;">${data.scene.heading}</div>
                    </div>
                    <div class="severity-badge severity-${severity}">${severity}</div>
                </div>
                
                <p><strong>Safety Reason:</strong> ${data.safety?.reason || 'N/A'}</p>

                ${grafanaHtml}

                <div style="margin-top: 30px;">
                    <div class="card">
                        <h3>Hazard Tags Detected</h3>
                        <div>${hazardsHtml}</div>
                    </div>

                    <div class="card">
                        <h3>Required Clears</h3>
                        <ul style="list-style-type: none; padding-left: 0;">
                            ${clearsHtml}
                        </ul>
                    </div>

                    <div class="card">
                        <h3>Department Deltas</h3>
                        <ul>
                            ${deltasHtml}
                        </ul>
                    </div>
                </div>
                
                <div style="margin-top: 50px; font-size: 0.8em; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 20px;">
                    <p>Jurisdiction: ${data.jurisdiction} | Primary Model: ${data.model_primary}</p>
                    <p><em>This is a safety workflow assistant, not legal advice. Final authority remains with production safety leadership and applicable regulators.</em></p>
                </div>
            `;

        } catch (e) {
            document.getElementById('app').innerHTML = `
                <div class="card" style="border-color: var(--red);">
                    <h3 style="color: var(--red);">Error Loading Data</h3>
                    <p>Could not load output.json. Ensure the Python pipeline has run successfully and the frontend is served via a local web server.</p>
                    <pre>${e.message}</pre>
                </div>
            `;
        }
    }

    loadData();
</script>
</body>
</html>
