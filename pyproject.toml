[project]
name = "google-cinema-hacka"
version = "0.1.0"
description = "Gemini agent: script revision to per-department deltas and NCSO safety escalation, published to Grafana"
requires-python = ">=3.11"
dependencies = ["mcp>=2.1", "python-dotenv>=1.0", "google-genai>=1.0", "google-adk>=2.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
